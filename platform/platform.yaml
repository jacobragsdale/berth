# yaml-language-server: $schema=schema/platform.schema.json
# Platform settings, owned by the platform team. Every change here needs platform review:
# review.yaml has no rule for files outside apps/, and unmatched changes need the platform team.
registry: contosoacr.azurecr.io
tenant_id: 00000000-0000-0000-0000-000000000000
repo_url: https://dev.azure.com/contoso/platform/_git/berth

# Identity the release pipeline uses when it opens version-bump pull requests. It may change versions only.
release_bot: berth-release@contoso.com

# Identity the weekly rightsizing pipeline opens pull requests as. It may change sizes only. Its settings
# (lookback, margins, Datadog queries) default as in docs/reference.md; prices only feed the savings estimate.
rightsizing_bot: berth-rightsizing@contoso.com
rightsizing:
  price_per_vcpu_month: "25.00"
  price_per_gib_month: "3.50"

# Individuals, not a team. Any one of them (other than the author) satisfies a platform-tier review.
platform_approvers:
  - infra.lead@contoso.com
  - platform.oncall@contoso.com

max_replicas_without_review: 10
storage_class: managed-csi

# gateway_ip is the reserved private address of the cluster's Gateway; each environment's wildcard DNS record
# (*.<domain>) points at it. networks are the pod and service ranges, never sent through the proxy.
# key_vault holds platform secrets on the cluster, such as the Gateway's certificates.
clusters:
  aks-qa:
    key_vault: kv-contoso-platform-qa
    gateway_ip: 10.20.0.50
    networks: [10.244.0.0/16, 10.0.0.0/16]
  aks-prod:
    key_vault: kv-contoso-platform-prod
    gateway_ip: 10.30.0.50
    networks: [10.244.0.0/16, 10.0.0.0/16]

# Gateway API, implemented by Envoy Gateway (platform/software/envoy-gateway.yaml). Each cluster has one Gateway,
# with a listener per environment that accepts routes only from that environment's namespaces.
gateway:
  namespace: envoy-gateway-system
  controller: gateway.envoyproxy.io/gatewayclass-controller

# Links shown by `berth explain` and in the drift report. Placeholders: {app} {env} {namespace} {service} {cluster}.
links:
  datadog-logs: https://app.datadoghq.com/logs?query=service%3A{service}%20env%3A{env}
  datadog-traces: https://app.datadoghq.com/apm/traces?query=service%3A{service}%20env%3A{env}

# Each environment's break_glass_groups may change its app namespaces with kubectl in an emergency: workloads and
# settings, never Secrets or a shell (the berth-break-glass role). That removes standing access to secrets, not every
# path to one: a changed command can print a secret. The daily drift report shows what they changed.
# Production's group is managed by Entra PIM: nobody is in it until they ask, and membership ends by itself.
environments:
  dev:
    cluster: aks-qa
    key_vault: kv-contoso-dev
    default_replicas: 1
    domain: dev.apps.contoso.com
    proxy: {url: "http://proxy.contoso.com:8080", no_proxy: [.contoso.com]}
    otlp_endpoint: http://$(HOST_IP):4318  # the Datadog Agent's OTLP receiver on each node
    airflow: {namespace: airflow-dev, service_account: airflow-worker}
    controlm: {server: ctm-nonprod, connection_profile: K8S_DEV, timezone: America/New_York, agent_namespace: controlm, agent_service_account: controlm-agent}
    break_glass_groups: [77777777-7777-7777-7777-777777777777]  # all developers
  qa:
    cluster: aks-qa
    key_vault: kv-contoso-qa
    promotes_from: dev
    default_replicas: 1
    domain: qa.apps.contoso.com
    proxy: {url: "http://proxy.contoso.com:8080", no_proxy: [.contoso.com]}
    otlp_endpoint: http://$(HOST_IP):4318
    airflow: {namespace: airflow-qa, service_account: airflow-worker}
    controlm: {server: ctm-nonprod, connection_profile: K8S_QA, timezone: America/New_York, agent_namespace: controlm, agent_service_account: controlm-agent}
    break_glass_groups: [77777777-7777-7777-7777-777777777777]  # all developers
  prod:
    cluster: aks-prod
    key_vault: kv-contoso-prod
    production: true
    promotes_from: qa
    default_replicas: 2
    domain: apps.contoso.com
    proxy: {url: "http://proxy.contoso.com:8080", no_proxy: [.contoso.com]}
    otlp_endpoint: http://$(HOST_IP):4318
    airflow: {namespace: airflow, service_account: airflow-worker}
    controlm: {server: ctm-prod, connection_profile: K8S_PROD, timezone: America/New_York, agent_namespace: controlm, agent_service_account: controlm-agent}
    break_glass_groups: [88888888-8888-8888-8888-888888888888]  # prod break-glass: Entra PIM, eligible for all developers

# The menu of pod sizes. Apps pick a name; the platform owns what it means. Memory limit = request; no CPU limit.
sizes:
  xs: {cpu: 100m, memory: 128Mi}
  s: {cpu: 250m, memory: 512Mi}
  m: {cpu: 500m, memory: 1Gi}
  l: {cpu: "1", memory: 2Gi}
  xl: {cpu: "2", memory: 4Gi, platform_review: true}
  xxl: {cpu: "4", memory: 8Gi, platform_review: true}

# Managed identities provisioned by the platform team (Terraform/Bicep), by app/env. Client IDs are not secret.
identities:
  ledger/dev: 11111111-1111-1111-1111-111111111111
  ledger/qa: 22222222-2222-2222-2222-222222222222
  ledger/prod: 33333333-3333-3333-3333-333333333333

# Production changes wait during a freeze. Break-glass pull requests are exempt.
freezes:
  - start: 2026-12-28T00:00:00-05:00
    end: 2027-01-04T00:00:00-05:00
    reason: year-end close
