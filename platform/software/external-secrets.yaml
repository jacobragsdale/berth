# yaml-language-server: $schema=../schema/software.schema.json
# External Secrets Operator copies Key Vault secrets into Kubernetes Secrets. One managed identity per cluster
# (a one-time request to cloud engineering) reads that cluster's environment vaults and its platform vault.
description: Syncs secrets from Azure Key Vault into Kubernetes
repo: https://charts.external-secrets.io
chart: external-secrets
version: 2.14.0
order: 10  # its CRDs come before anything that uses them
values:
  podLabels:
    azure.workload.identity/use: "true"
  serviceAccount:
    name: external-secrets
installs:
  external-secrets:
    cluster: aks-qa
    namespace: external-secrets
    values:
      serviceAccount:
        annotations: {azure.workload.identity/client-id: 55555555-5555-5555-5555-555555555555}
  external-secrets-prod:
    cluster: aks-prod
    namespace: external-secrets
    values:
      serviceAccount:
        annotations: {azure.workload.identity/client-id: 66666666-6666-6666-6666-666666666666}
