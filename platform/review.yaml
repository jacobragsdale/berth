# Who must approve what. Each change is a dotted path into one app's spec for one environment
# (app.yaml merged with <env>.yaml). The first rule whose path matches decides the tier:
#
#   auto      no approval when an owner (or the release bot, for versions) opens the pull request
#   owner     another owner of the app approves
#   platform  an owner and a platform approver both approve
#
# `*` matches one key and `**` any number; a key with a dot in it, such as the file name in files.indexer.toml, is
# still one key. A path no rule matches needs platform review, and so
# does anything outside apps/. Production never drops below owner. Code adds three escalations on top of
# this table (see src/berth/review.py): sizes marked platform_review, replicas above
# max_replicas_without_review, and a version that has not run in the environment it promotes from.
rules:
  - reason: a new version
    paths: [version]
    tier: {dev: auto, qa: auto, prod: owner}

  - reason: application settings
    paths: [config.*, files.*, secrets, talks_to, calls]
    tier: {dev: auto, qa: auto, prod: owner}

  # When one app adds another to its talks_to, the called app's network policy starts admitting it. berth records that
  # as a change to the called app (callers.<caller>), so the called app's owners decide who may reach it.
  - reason: a new caller (this app's network policy will admit it)
    paths: [callers.*]
    tier: {dev: auto, qa: auto, prod: owner}

  - reason: how a service runs
    paths:
      - services.*.command
      - services.*.args
      - services.*.port
      - services.*.health.**
      - services.*.size
      - services.*.replicas
      - services.*.autoscale.**
      - services.*.writable
      - services.*.expose
    tier: {dev: auto, qa: auto, prod: owner}

  - reason: what a workflow runs and when
    paths: [workflows.**]
    tier: {dev: auto, qa: auto, prod: owner}

  - reason: a company hostname (callers use it; changing one in prod breaks them)
    paths: [services.*.hostname]
    tier: {dev: auto, qa: auto, prod: owner}

  - reason: persistent storage
    paths: [services.*.volumes.**]
    tier: platform

  - reason: access to Azure resources
    paths: [azure_identity]
    tier: platform

  - reason: the escape hatch (raw patches to rendered objects)
    paths: [overrides]
    tier: platform

  - reason: ownership and description
    paths: [owners, description, source, image]
    tier: owner

  - reason: other files in the app's directory
    paths: [repo_file.**]
    tier: owner

  - reason: starting or stopping an app in an environment
    paths: [environment]
    tier: {dev: auto, qa: owner, prod: platform}

  # A new app is also judged by the environments it starts in (above), so its first prod deploy needs the platform team.
  - reason: a new or retired app
    paths: [app]
    tier: owner
