apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: berth-admission
policies: [../images.yaml, ../resources.yaml, ../secrets.yaml, ../ownership.yaml]
resources: [resources.yaml]
results:
  - {isValidatingPolicy: true, policy: berth-images, kind: Deployment, resources: [good-api, no-memory-limit], result: pass}
  - {isValidatingPolicy: true, policy: berth-images, kind: Deployment, resources: [public-registry], result: fail}
  - {isValidatingPolicy: true, policy: berth-images, kind: CronJob, resources: [tag-only], result: fail}
  - {isValidatingPolicy: true, policy: berth-resources, kind: Deployment, resources: [good-api, public-registry], result: pass}
  - {isValidatingPolicy: true, policy: berth-resources, kind: Deployment, resources: [no-memory-limit], result: fail}
  - {isValidatingPolicy: true, policy: berth-secrets, kind: ExternalSecret, resources: [good-secrets], result: pass}
  - {isValidatingPolicy: true, policy: berth-secrets, kind: ExternalSecret, resources: [other-apps-key, wrong-namespace, other-env-store, data-from], result: fail}
  - {isValidatingPolicy: true, policy: berth-ownership, kind: Namespace, resources: [good-dev], result: pass}
  - {isValidatingPolicy: true, policy: berth-ownership, kind: Namespace, resources: [one-owner-dev], result: fail}
