# Namespace labels for the offline CLI: demo-dev and ledger-dev are app namespaces, kube-system is not.
apiVersion: cli.kyverno.io/v1alpha1
kind: Value
namespaceSelector:
  - name: demo-dev
    labels: {app.kubernetes.io/managed-by: berth}
  - name: ledger-dev
    labels: {app.kubernetes.io/managed-by: berth}
  - name: kube-system
    labels: {}
