apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: berth-secrets
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets]
  variables:
    - name: app
      expression: object.metadata.?labels[?'berth.contoso.io/app'].orValue('')
    - name: env
      expression: object.metadata.?labels[?'berth.contoso.io/env'].orValue('')
  validations:
    - message: An ExternalSecret must live in its own app's namespace (<app>-<env>).
      expression: variables.app != '' && object.metadata.namespace == variables.app + '-' + variables.env
    - message: An ExternalSecret must use its environment's store (berth-<env>).
      expression: object.spec.secretStoreRef.kind == 'ClusterSecretStore' && object.spec.secretStoreRef.name == 'berth-' + variables.env
    - message: Key Vault keys must start with the app's name and two dashes (<app>--<secret>).
      expression: object.spec.?data.orValue([]).all(d, d.remoteRef.key.startsWith(variables.app + '--'))
    - message: dataFrom is not allowed; a find query could read every secret in the vault.
      expression: "!has(object.spec.dataFrom)"
