# Every morning: compare both clusters with main and post the result to Slack, even when everything is in sync,
# so a missing message means this pipeline broke. The platform team acts on what it reports.
#
# Azure DevOps schedules in UTC: 13:00 UTC is 9:00 in New York in summer and 8:00 in winter.
#
# Each cluster gets its own message, from its own step, with that cluster's deploy identity. berth reads who set each
# field and diffs only the namespaces that look different, with a server-side dry run. Kubernetes RBAC cannot grant
# "dry run only", so a read-only identity cannot check drift; berth drift itself never writes.
#
# Not yet run in Azure DevOps. Uses the deploy pipeline's service connections (berth-aks-qa, berth-aks-prod) and a
# variable group berth-drift holding SLACK_WEBHOOK_URL, linked to Key Vault.
trigger: none
pr: none
schedules:
  - cron: "0 13 * * *"
    displayName: Daily drift report
    branches:
      include: [main]
    always: true  # run even when main has not changed: drift happens on the cluster, not in git

pool:
  vmImage: ubuntu-24.04

variables:
  - group: berth-drift

steps:
  - checkout: self
  - template: templates/setup-uv.yml
  - script: scripts/fetch-tools.sh
    displayName: Pinned kubectl
  # kubelogin borrows the Azure CLI's sign-in, which ends with the task, so each cluster is one task.
  - ${{ each cluster in split('aks-qa,aks-prod', ',') }}:
      - task: AzureCLI@2
        displayName: berth drift on ${{ cluster }}
        condition: always()  # one cluster's failure must not hide the other's report
        inputs:
          azureSubscription: berth-${{ cluster }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            az aks get-credentials --resource-group rg-${{ cluster }} --name ${{ cluster }} --context ${{ cluster }} --overwrite-existing
            kubelogin convert-kubeconfig -l azurecli
            uv run berth drift --cluster ${{ cluster }} --slack --details "$(Agent.TempDirectory)/drift-${{ cluster }}.txt"
            echo "##vso[task.uploadfile]$(Agent.TempDirectory)/drift-${{ cluster }}.txt"
        env:
          BERTH_KUBECTL: $(Build.SourcesDirectory)/.tools/bin/kubectl
          SLACK_WEBHOOK_URL: $(SLACK_WEBHOOK_URL)
