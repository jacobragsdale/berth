# Every morning: compare both clusters with main and post the result to Slack, even when everything is in sync,
# so a missing message means this pipeline broke. The platform team acts on what it reports.
#
# Azure DevOps schedules in UTC: 13:00 UTC is 9:00 in New York in summer and 8:00 in winter.
#
# Not yet run in Azure DevOps. Needs a read-only service connection berth-aks-read (an identity that can get and
# list in berth's namespaces on both clusters), and a variable group berth-drift holding SLACK_WEBHOOK_URL, linked
# to Key Vault.
trigger: none
pr: none
schedules:
  - cron: "0 13 * * *"
    displayName: Daily drift report
    branches:
      include: [main]
    always: true  # run even when main has not changed: drift happens on the cluster, not in git

pool:
  vmImage: ubuntu-24.04

variables:
  - group: berth-drift

steps:
  - checkout: self
  - template: templates/setup-uv.yml
  - script: scripts/fetch-tools.sh
    displayName: Pinned kubectl
  # One task: kubelogin borrows the Azure CLI's sign-in, which ends when the task does.
  - task: AzureCLI@2
    displayName: berth drift
    inputs:
      azureSubscription: berth-aks-read
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        for cluster in aks-qa aks-prod; do
          az aks get-credentials --resource-group "rg-$cluster" --name "$cluster" --context "$cluster" --overwrite-existing
        done
        kubelogin convert-kubeconfig -l azurecli
        uv run berth drift --cluster aks-qa --cluster aks-prod --slack --details "$(Agent.TempDirectory)/drift.txt"
        echo "##vso[task.uploadfile]$(Agent.TempDirectory)/drift.txt"
    env:
      BERTH_KUBECTL: $(Build.SourcesDirectory)/.tools/bin/kubectl
      SLACK_WEBHOOK_URL: $(SLACK_WEBHOOK_URL)
