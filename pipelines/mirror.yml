# Every day: for each image in platform/mirrors.yaml, find the newest upstream tag on its track, copy it into ACR,
# and open the dev release pull request for every app that runs an older one. It opens them as the release bot,
# which may change versions only, so dev updates merge once the checks pass; qa and prod are promoted by people.
#
# Not yet run in Azure DevOps. Needs a service connection berth-release for the release bot's identity, with
# AcrPush on the registry (to import) and permission to open pull requests in this repository.
trigger: none
pr: none
schedules:
  - cron: "0 6 * * *"
    displayName: Daily mirror
    branches:
      include: [main]
    always: true

pool:
  vmImage: ubuntu-24.04

variables:
  - template: templates/targets.yml

steps:
  - checkout: self
    persistCredentials: true  # berth pr pushes a branch per release
  - template: templates/setup-uv.yml
  - script: uv run berth mirror --plan-out "$(Agent.TempDirectory)/mirror.json"
    displayName: Find newer upstream tags
  - task: AzureCLI@2
    displayName: Import into ACR and open the release pull requests
    inputs:
      azureSubscription: berth-release
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        BERTH_ADO_TOKEN=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
        export BERTH_ADO_TOKEN
        uv run berth mirror --rows "$(Agent.TempDirectory)/mirror.json" | while IFS=$'\t' read -r source target tag env app; do
          az acr import --name "$(registry)" --source "$source:$tag" --image "$target:$tag" --force
          digest=$(az acr repository show --name "$(registry)" --image "$target:$tag" --query digest -o tsv)
          git checkout -q -B "mirror/$app/$tag" origin/main
          uv run berth release "$app" --env "$env" --version "$tag@$digest"
          uv run berth pr --branch "mirror/$app/$tag" --title "release $app $tag to $env" --auto-complete \
            --description "New upstream tag $source:$tag, copied to $target."
        done
    env:
      GIT_AUTHOR_NAME: berth release
      GIT_AUTHOR_EMAIL: berth-release@contoso.com
      GIT_COMMITTER_NAME: berth release
      GIT_COMMITTER_EMAIL: berth-release@contoso.com
