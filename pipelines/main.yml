# After a merge to main: deploy each cluster in turn (qa, then prod), publish what each now runs to the rendered
# branch, then deploy Control-M from that branch.
#
# Each app namespace converges on its own. One whose stamped digest matches what main renders is left alone; one that
# failed is retried by the next run; an app environment whose source environment failed in this run is held, here
# and on the next cluster (--hold-from). A failed app marks the stage "succeeded with issues" and the run goes on for
# every other app. Only a failed platform (cluster software, shared objects, admission policies) stops the run.
#
# Runs never overlap. Merges are batched, and with an exclusive lock check on each berth-<cluster> environment,
# lockBehavior runLatest lets a newer run replace a queued older one rather than wait behind it. berth deploy also
# refuses to apply over a namespace that a newer commit was deployed to.
#
# Not yet run in Azure DevOps. Needs service connections berth-aks-qa and berth-aks-prod (workload identity
# federation, with a Kubernetes role that can apply to berth's namespaces); an exclusive lock check on the
# environments berth-aks-qa and berth-aks-prod; and permission for the build service to push the rendered branch,
# which a branch policy keeps everyone else from pushing. Control-M is run by another team: CTM_ENDPOINT and
# CTM_TOKEN are theirs, scoped to berth's folders.
trigger:
  batch: true
  branches:
    include: [main]
pr: none
lockBehavior: runLatest

parameters:
  - name: revert
    displayName: Put git back over changes made by hand
    type: boolean
    default: false
  # Deploys delete what git no longer renders (never namespaces or volumes), up to platform.yaml's deploys.prune_limit.
  - name: noPrune
    displayName: Keep objects git no longer renders
    type: boolean
    default: false
  - name: pruneAll
    displayName: Delete past the prune brake
    type: boolean
    default: false

variables:
  - template: templates/targets.yml

pool:
  vmImage: ubuntu-24.04

stages:
  - ${{ each cluster in split(variables.clusters, ',') }}:
      - stage: ${{ replace(cluster, '-', '_') }}
        displayName: Deploy to ${{ cluster }}
        jobs:
          - deployment: deploy
            environment: berth-${{ cluster }}
            strategy:
              runOnce:
                deploy:
                  # A deployment job downloads this run's artifacts first: the earlier clusters' results.
                  steps:
                    - checkout: self
                      fetchDepth: 0  # berth deploy asks git whether a commit on the cluster is newer than this one
                      persistCredentials: true  # berth publish pushes the rendered branch
                    - template: templates/setup-uv.yml
                    - script: scripts/fetch-tools.sh
                      displayName: Pinned kubectl and Helm
                    - task: AzureCLI@2
                      displayName: berth deploy
                      inputs:
                        azureSubscription: berth-${{ cluster }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          az aks get-credentials --resource-group rg-${{ cluster }} --name ${{ cluster }} --context ${{ cluster }} --overwrite-existing
                          kubelogin convert-kubeconfig -l azurecli
                          args=(--cluster ${{ cluster }} --results-out "$(Agent.TempDirectory)/results.json")
                          for earlier in "$(Pipeline.Workspace)"/deploy-*/results.json; do
                            if [ -f "$earlier" ]; then args+=(--hold-from "$earlier"); fi
                          done
                          if [ "${{ parameters.revert }}" = "True" ]; then args+=(--revert); fi
                          if [ "${{ parameters.noPrune }}" = "True" ]; then args+=(--no-prune); fi
                          if [ "${{ parameters.pruneAll }}" = "True" ]; then args+=(--prune-all); fi
                          code=0
                          uv run berth deploy "${args[@]}" || code=$?
                          case "$code" in
                            0) ;;
                            2) echo "##vso[task.complete result=SucceededWithIssues;]Some app environments failed or were held; every other app deployed." ;;
                            *) exit "$code" ;;
                          esac
                      env:
                        BERTH_KUBECTL: $(Build.SourcesDirectory)/.tools/bin/kubectl
                        BERTH_HELM: $(Build.SourcesDirectory)/.tools/bin/helm
                    - script: uv run berth publish --cluster ${{ cluster }} --results "$(Agent.TempDirectory)/results.json"
                      displayName: Publish what ${{ cluster }} runs to the rendered branch
                    - publish: $(Agent.TempDirectory)/results.json
                      artifact: deploy-${{ cluster }}
                      displayName: Keep the results for the next cluster

  # Control-M reads the rendered branch, so it only ever receives jobs whose namespace runs what they expect.
  - ${{ each env in split(variables.environments, ',') }}:
      - stage: controlm_${{ env }}
        displayName: Control-M ${{ env }}
        dependsOn:
          - ${{ each cluster in split(variables.clusters, ',') }}:
              - ${{ replace(cluster, '-', '_') }}
        jobs:
          - deployment: deploy
            environment: berth-controlm-${{ env }}
            variables:
              - group: berth-controlm-${{ env }}  # CTM_ENDPOINT, CTM_TOKEN (Key Vault-linked)
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - script: |
                        set -euo pipefail
                        out="$(Agent.TempDirectory)/rendered"
                        mkdir -p "$out"
                        git fetch --quiet --depth 1 origin rendered
                        git archive FETCH_HEAD "controlm/${{ env }}" | tar -x -C "$out" || echo "no Control-M jobs for ${{ env }}"
                        shopt -s nullglob
                        files=("$out/controlm/${{ env }}"/*.json)
                        if (( ${#files[@]} == 0 )); then echo "nothing to deploy"; exit 0; fi
                        curl -fsSL "$(CTM_ENDPOINT)/ctm-cli.tgz" -o ctm-cli.tgz
                        npm install -g ctm-cli.tgz
                        ctm environment add berth "$(CTM_ENDPOINT)" "$(CTM_TOKEN)"
                        for f in "${files[@]}"; do ctm deploy "$f" -e berth; done
                      displayName: ctm deploy
                      # ctm deploy only adds and updates: folders that disappear from the branch are left on the server.
