# Every Monday: compare each workload's size with what it used in Datadog over the last two weeks, and open one
# pull request per app per environment where a different size from the menu fits better. The pull request carries
# the evidence. The bot may change sizes only (platform.yaml rightsizing_bot), so in dev and qa it merges once the
# checks pass, and in prod an owner approves it. A pull request still open from last week is updated, not repeated.
#
# Not yet run in Azure DevOps. Needs a variable group berth-datadog (DD_API_KEY, DD_APP_KEY, DD_SITE; Key Vault-
# linked), and a service connection berth-rightsizing for the bot's identity, which opens the pull requests.
# The Datadog metric names in platform.yaml rightsizing are defaults: check them against your account before
# enabling the schedule. With no data for a workload, the bot proposes nothing for it.
trigger: none
pr: none
schedules:
  - cron: "0 12 * * 1"
    displayName: Weekly rightsizing
    branches:
      include: [main]
    always: true

pool:
  vmImage: ubuntu-24.04

variables:
  - group: berth-datadog
  - template: templates/targets.yml

steps:
  - checkout: self
    persistCredentials: true  # berth pr pushes a branch per app and environment
  - template: templates/setup-uv.yml
  - ${{ each env in split(variables.environments, ',') }}:
      - script: uv run berth rightsize --env ${{ env }} --plan-out "$(Agent.TempDirectory)/rightsize-${{ env }}.json"
        displayName: Read Datadog for ${{ env }}
        env:
          DD_API_KEY: $(DD_API_KEY)
          DD_APP_KEY: $(DD_APP_KEY)
          DD_SITE: $(DD_SITE)
  - task: AzureCLI@2
    displayName: Open or update the pull requests
    inputs:
      azureSubscription: berth-rightsizing  # the rightsizing bot identity
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        BERTH_ADO_TOKEN=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
        export BERTH_ADO_TOKEN
        for env in $(echo "$(environments)" | tr ',' ' '); do
          plan="$(Agent.TempDirectory)/rightsize-$env.json"
          for app in $(uv run berth rightsize --apps "$plan"); do
            branch="rightsize/$app-$env"  # one branch per app and environment, so an ignored pull request is updated
            git checkout -q -B "$branch" origin/main
            uv run berth rightsize --apply "$plan" --app "$app" --markdown "$(Agent.TempDirectory)/pr.md"
            uv run berth pr --branch "$branch" --title "rightsize $app in $env" --description-file "$(Agent.TempDirectory)/pr.md" --auto-complete
          done
        done
    env:
      GIT_AUTHOR_NAME: berth rightsizing
      GIT_AUTHOR_EMAIL: berth-rightsizing@contoso.com
      GIT_COMMITTER_NAME: berth rightsizing
      GIT_COMMITTER_EMAIL: berth-rightsizing@contoso.com
