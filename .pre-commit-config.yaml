# rendered/ is what `berth render` writes for reading. git ignores it, so hooks never see it; this keeps it that way
# if someone adds it by mistake. What runs is rendered in memory by `berth deploy` and published to the rendered branch.
exclude: ^rendered/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]  # rendered Kubernetes manifests are; a test fixture made from them would be
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6   # keep in sync with the uv version the repo is built with
    hooks:
      - id: uv-lock   # fails the commit if pyproject.toml changed without uv.lock

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.95   # keep in sync with the pinned ty dev dependency
    hooks:
      - id: ty
