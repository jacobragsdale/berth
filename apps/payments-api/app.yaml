# yaml-language-server: $schema=../../platform/schema/app.schema.json
name: payments-api
description: Card payment authorisation API and nightly settlement
owners:
  - alice.ng@contoso.com
  - bob.osei@contoso.com
source: https://dev.azure.com/contoso/payments/_git/payments-api

services:
  api:
    command: [uvicorn, payments.api:app, --host, 0.0.0.0, --port, "8080"]
    port: 8080
    health: {path: /healthz}
    size: m

workflows:
  settlement:
    orchestrator: airflow
    schedule: 0 2 * * 1-5
    timezone: America/New_York
    tasks:
      extract:
        command: [python, -m, payments.jobs.extract]
        timeout: 30m
        retries: 2
      settle:
        command: [python, -m, payments.jobs.settle]
        size: l
        timeout: 2h
        depends_on: [extract]

config:
  LOG_LEVEL: info
  SETTLEMENT_CURRENCY: USD

secrets: [db-password, card-processor-key]
talks_to: [ledger/api]
