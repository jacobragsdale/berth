# yaml-language-server: $schema=../../platform/schema/app.schema.json
# Third-party software as an ordinary app: Redis, copied into ACR. platform/mirrors.yaml keeps it current.
name: rates-cache
description: Redis cache of FX rates for payments-api
owners:
  - alice.ng@contoso.com
  - bob.osei@contoso.com
source: https://hub.docker.com/_/redis
image: mirror/redis
files:
  redis.conf: |
    # A cache: nothing is persisted.
    save ""
    appendonly no
services:
  redis:
    port: 6379  # no health path: berth checks the port
    size: s
    args: [/config/redis.conf]
    writable: [/data]  # the image's working directory; empty on every restart
